plugins {
    id 'java'
    id 'application'
}

group = 'ru.mcs'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.5.4'
}

application {
    mainClass = 'ru.mcs.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

run {
    // чтобы кириллица в UI отображалась корректно даже в Windows-консоли
    jvmArgs = ['-Dfile.encoding=UTF-8']
}